<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>登录 / 注册｜MakerMind AI</title>
  <link rel="stylesheet" href="styles.css?v=20260711" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">MM</span>
      <span>
        <strong>MakerMind AI</strong>
        <small>Project-based lesson studio</small>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="generator.html">任务生成器</a>
      <a href="about.html">关于我们</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card" id="authCard">
      <h1 id="authTitle">欢迎回来</h1>
      <p class="auth-subtitle" id="authSubtitle">账号 + 密码即可登录，无需邮箱</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login" id="tabLogin">登录</button>
        <button class="auth-tab" data-mode="register" id="tabRegister">注册</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="authForm">
        <div class="auth-field">
          <label for="username">账号</label>
          <input type="text" id="username" placeholder="例如：lilaoshi" autocomplete="username" maxlength="32" />
        </div>

        <div class="auth-field">
          <label for="password">密码</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="至少 6 位" autocomplete="current-password" style="padding-right:44px;" />
            <button type="button" class="password-toggle" id="passwordToggle" title="显示密码" aria-label="切换密码可见性">👁️</button>
          </div>
        </div>

        <div class="auth-field register-only">
          <label>身份（可选）</label>
          <div class="auth-role-group">
            <label><input type="radio" name="role" value="teacher" checked /> 教师</label>
            <label><input type="radio" name="role" value="parent" /> 家长</label>
            <label><input type="radio" name="role" value="student" /> 学生</label>
          </div>
        </div>

        <button type="submit" class="auth-submit" id="authSubmit">登录</button>
      </form>

      <p class="auth-toggle-hint login-only">
        还没有账号？<a href="#" id="toRegister">立即注册</a>
      </p>
      <p class="auth-toggle-hint register-only">
        已有账号？<a href="#" id="toLogin">返回登录</a>
      </p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let mode = params.get("mode") === "register" ? "register" : "login";
    const redirect = params.get("redirect") || "dashboard.html";

    const card = document.getElementById("authCard");
    const title = document.getElementById("authTitle");
    const subtitle = document.getElementById("authSubtitle");
    const submitBtn = document.getElementById("authSubmit");
    const errorEl = document.getElementById("authError");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add("show");
    }

    function clearError() {
      errorEl.classList.remove("show");
    }

    function setMode(m) {
      mode = m;
      clearError();
      if (m === "register") {
        card.classList.add("is-register");
        title.textContent = "创建账号";
        subtitle.textContent = "设一个账号和密码就能用，30 秒完成";
        submitBtn.textContent = "注册";
        tabLogin.classList.remove("active");
        tabRegister.classList.add("active");
      } else {
        card.classList.remove("is-register");
        title.textContent = "欢迎回来";
        subtitle.textContent = "账号 + 密码即可登录";
        submitBtn.textContent = "登录";
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
      }
    }

    tabLogin.addEventListener("click", function () { setMode("login"); });
    tabRegister.addEventListener("click", function () { setMode("register"); });
    document.getElementById("toRegister").addEventListener("click", function (e) { e.preventDefault(); setMode("register"); });
    document.getElementById("toLogin").addEventListener("click", function (e) { e.preventDefault(); setMode("login"); });

    if (window.MMAuth && window.MMAuth.isLoggedIn()) {
      location.href = redirect;
    }

    document.getElementById("authForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      clearError();

      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showError("请填写账号和密码");
        return;
      }

      const payload = { username, password };

      if (mode === "register") {
        payload.role = document.querySelector('input[name="role"]:checked').value;
        payload.displayName = username;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = mode === "register" ? "注册中…" : "登录中…";

      try {
        const endpoint = mode === "register" ? "/api/auth/register" : "/api/auth/login";
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || "操作失败，请重试");
          submitBtn.disabled = false;
          submitBtn.textContent = mode === "register" ? "注册" : "登录";
          return;
        }

        window.MMAuth.setAuth(data.token, data.user);
        location.href = redirect;
      } catch (err) {
        showError("网络错误，请检查连接后重试");
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "register" ? "注册" : "登录";
      }
    });

    setMode(mode);

    (function () {
      var btn = document.getElementById("passwordToggle");
      var input = document.getElementById("password");
      if (btn && input) {
        btn.addEventListener("click", function () {
          var isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          btn.textContent = isPassword ? "🙈" : "👁️";
        });
      }
    })();
  </script>
</body>
</html>
