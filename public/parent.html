<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家长端｜MakerMind AI</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">MM</span><span><strong>MakerMind AI</strong><small>Parent growth report</small></span></a>
    <nav class="nav-links"><a href="index.html">首页</a><a href="parent.html">成长报告</a><a href="dashboard.html">工作台</a></nav>
  </header>

  <main class="dashboard-wrap role-workspace parent-workspace">
    <div class="dash-header role-hero parent-hero">
      <div class="dash-greeting"><span class="eyebrow">PARENT REPORT</span><h1>孩子成长报告</h1><p>家长端不是另一个工作台，而是同步老师端和学生端的结果：项目进度、课堂总结、老师反馈和作品展示。</p></div>
    </div>

    <section class="loop-rail parent-rail" aria-label="家校同步流程">
      <div><strong>老师布置</strong><span>项目进入学生任务板</span></div>
      <div><strong>学生提交</strong><span>作品同步给老师</span></div>
      <div><strong>课堂记录</strong><span>进度和画像自动更新</span></div>
      <div><strong>家长查看</strong><span>只读成长报告</span></div>
    </section>

    <div class="dash-stats" id="stats"></div>
    <section class="project-grid" id="children"><div class="loading-spin">加载中…</div></section>
  </main>

  <script src="auth.js"></script>
  <script>
    if (window.MMAuth.requireAuth("parent.html")) {
      const user = window.MMAuth.getCurrentUser();
      if (user.role !== "parent") location.href = user.role === "teacher" ? "teacher.html" : "student.html";
      const list = document.getElementById("children");
      const stats = document.getElementById("stats");
      function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}
      function text(v, fallback){return Array.isArray(v)?v.join("、"):(v||fallback||"");}
      function progressBar(n){var pct=Math.max(0,Math.min(100,n||0));var cls=pct<30?'low':pct<70?'medium':'high';return '<div class="role-progress '+cls+'"><span style="width:'+pct+'%"></span></div>';}
      function short(t,n){t=String(t||'');return t.length>n?t.slice(0,n)+'…':t;}
      async function loadChild(s){
        const [pRes,seRes,fRes,wRes]=await Promise.all([
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/progress'),
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/sessions'),
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/feedbacks'),
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/works')
        ]);
        const p=await pRes.json(), se=await seRes.json(), f=await fRes.json(), w=await wRes.json();
        return Object.assign({},s,{progress:p.progress||[],summary:p.summary||{},sessions:se.sessions||[],feedbacks:f.feedbacks||[],works:w.works||[]});
      }
      function renderTimeline(s){
        const items=[];
        if(s.feedbacks[0]) items.push(['老师反馈',s.feedbacks[0].content]);
        if(s.sessions[0]) items.push(['课堂总结',s.sessions[0].structuredSummary||s.sessions[0].teacherNotes]);
        if(s.works[0]) items.push(['学生作品',s.works[0].workName||'最新作品已提交']);
        if(!items.length) return '<div class="empty-state mini"><h3>等待更新</h3><p>老师录入课堂或学生提交作品后会同步到这里。</p></div>';
        return '<div class="growth-timeline">'+items.map(i=>'<div><span>'+esc(i[0])+'</span><p>'+esc(short(i[1],96))+'</p></div>').join('')+'</div>';
      }
      function card(s){
        const current=s.progress[0];
        const pct=current?current.progressPercent:0;
        return '<article class="project-card connected-card parent-report-card"><div class="project-card-body">'+
          '<div class="card-topline"><span>成长报告</span><strong>'+esc(s.name)+'</strong></div>'+
          '<div class="project-card-tags"><span class="project-tag">'+esc(s.grade||'未填写年级')+'</span><span class="project-tag concept">'+esc(text(s.interestDirection,'暂无兴趣画像'))+'</span></div>'+
          '<div class="profile-strip"><div><span>能力</span><strong>'+esc(text(s.skillLevel,'待评估'))+'</strong></div><div><span>性格</span><strong>'+esc(text(s.personalityTraits,'课堂后生成'))+'</strong></div><div><span>风格</span><strong>'+esc(s.learningStyle||'待观察')+'</strong></div></div>'+
          '<p class="project-card-meta"><strong>当前项目：</strong>'+esc(current?current.title:'暂无项目')+'</p>'+progressBar(pct)+'<p class="project-card-meta">进度 '+pct+'% · 课堂 '+s.sessions.length+' · 反馈 '+s.feedbacks.length+' · 作品 '+s.works.length+'</p>'+
          renderTimeline(s)+
          '<div class="project-card-actions">'+(current?'<a class="pc-btn" href="generator.html?project='+encodeURIComponent(current.projectId)+'&studentId='+encodeURIComponent(s.studentId)+'">查看项目方案</a>':'')+'<span class="readonly-note">家长端只读，反馈由老师端同步。</span></div>'+
          '</div></article>';
      }
      async function load(){
        const res=await window.MMAuth.authFetch('/api/students');
        const data=await res.json();
        const children=await Promise.all((data.students||[]).map(loadChild));
        const avg=children.length?Math.round(children.reduce((a,s)=>a+(s.summary.averageProgress||0),0)/children.length):0;
        stats.innerHTML='<div class="dash-stat"><strong>'+children.length+'</strong><span>孩子</span></div><div class="dash-stat"><strong>'+avg+'%</strong><span>平均进度</span></div><div class="dash-stat"><strong>'+children.reduce((a,s)=>a+s.sessions.length,0)+'</strong><span>课堂记录</span></div><div class="dash-stat"><strong>'+children.reduce((a,s)=>a+s.works.length,0)+'</strong><span>作品</span></div>';
        list.innerHTML=children.length?children.map(card).join(''):'<div class="empty-state"><h3>暂无孩子档案</h3><p>请联系老师绑定家长账号。</p></div>';
      }
      load().catch(function(){list.innerHTML='<div class="error-state"><div class="error-icon">⚠️</div><h3>加载失败</h3><p>可能是网络问题或服务暂时不可用</p><button class="btn ghost small" onclick="location.reload()">重新加载</button></div>';});
    }
  </script>
</body>
</html>
