<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>教师端｜MakerMind AI</title>
  <link rel="stylesheet" href="styles.css?v=20260711" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">MM</span><span><strong>MakerMind AI</strong><small>Teacher loop console</small></span></a>
    <nav class="nav-links"><a href="index.html">首页</a><a href="generator.html">个性化生成</a><a href="session.html">课堂记录</a><a href="dashboard.html">项目库</a></nav>
  </header>

  <main class="dashboard-wrap role-workspace teacher-workspace">
    <div class="dash-header role-hero">
      <div class="dash-greeting"><span class="eyebrow">TEACHER CONTROL LOOP</span><h1>教师闭环工作台</h1><p>从“给学生生成项目”开始，串起布置任务、学生提交、课堂记录、可视化反馈和家长同步。</p></div>
      <a class="dash-new-btn" href="generator.html">+ 为学生生成新任务</a>
    </div>

    <section class="loop-rail" aria-label="正循环流程">
      <div><strong>1 生成</strong><span>选学生画像生成项目</span></div>
      <div><strong>2 布置</strong><span>自动进入学生任务</span></div>
      <div><strong>3 学生做</strong><span>提交作品和疑问</span></div>
      <div><strong>4 课堂记录</strong><span>语音/文本更新进度</span></div>
      <div><strong>5 反馈同步</strong><span>学生和家长同时看到</span></div>
    </section>

    <div class="dash-stats" id="stats"></div>

    <section class="role-section">
      <div class="section-heading"><div><span>VISUAL FEEDBACK</span><h2>待处理反馈队列</h2></div><p>这里把学生提交、低进度和缺反馈自动汇总，教师不需要在三个端之间来回找。</p></div>
      <div class="insight-grid" id="actionQueue"><div class="loading-spin">加载中…</div></div>
    </section>

  </main>

  <script src="auth.js"></script>
  <script>
    if (window.MMAuth.requireAuth("teacher.html")) {
      const user = window.MMAuth.getCurrentUser();
      if (user.role !== "teacher") location.href = user.role === "parent" ? "parent.html" : "student.html";
      const stats = document.getElementById("stats");
      const queue = document.getElementById("actionQueue");
      function esc(t){const d=document.createElement("div");d.textContent=String(t||"");return d.innerHTML;}
      function text(v, fallback){return Array.isArray(v)?v.join("、"):(v||fallback||"");}
      async function loadStudent(s){
        const [pRes,fRes,wRes,seRes] = await Promise.all([
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/progress'),
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/feedbacks'),
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/works'),
          window.MMAuth.authFetch('/api/students/'+s.studentId+'/sessions')
        ]);
        const p=await pRes.json(), f=await fRes.json(), w=await wRes.json(), se=await seRes.json();
        const progress=p.progress||[];
        return Object.assign({}, s, { progress, summary:p.summary||{}, feedbacks:f.feedbacks||[], works:w.works||[], sessions:se.sessions||[], current:progress[0] });
      }
      function queueItem(type,s,msg,href){
        return '<article class="insight-card"><span>'+esc(type)+'</span><h3>'+esc(s.name)+'</h3><p>'+esc(msg)+'</p><a class="pc-btn primary" href="'+href+'">处理</a></article>';
      }
      function renderQueue(students){
        const items=[];
        students.forEach(s=>{
          const pct=s.current?s.current.progressPercent:0;
          if(!s.current) items.push(queueItem('待布置',s,'还没有项目任务，先去生成器按画像生成。','generator.html?studentId='+encodeURIComponent(s.studentId)));
          if(s.current && pct<40) items.push(queueItem('进度预警',s,'当前项目只有 '+pct+'%，建议录入课堂记录。','session.html?studentId='+encodeURIComponent(s.studentId)+'&studentProjectId='+encodeURIComponent(s.current.id)));
          if(s.works.length && !s.feedbacks.length) items.push(queueItem('待反馈',s,'学生已提交作品，请写反馈。','session.html?studentId='+encodeURIComponent(s.studentId)));
        });
        queue.innerHTML=items.length?items.slice(0,6).join(''):'<div class="empty-state"><h3>目前没有紧急待办</h3><p>学生提交作品、进度偏低或缺少反馈时，会自动出现在这里。</p></div>';
      }
      async function load(){
        const res=await window.MMAuth.authFetch('/api/students');
        const data=await res.json();
        var students=await Promise.all((data.students||[]).map(loadStudent));
        const avg=students.length?Math.round(students.reduce((a,s)=>a+(s.summary.averageProgress||0),0)/students.length):0;
        stats.innerHTML='<div class="dash-stat"><strong>'+students.length+'</strong><span>学员</span></div><div class="dash-stat"><strong>'+avg+'%</strong><span>平均进度</span></div><div class="dash-stat"><strong>'+students.reduce((a,s)=>a+s.works.length,0)+'</strong><span>学生作品</span></div><div class="dash-stat"><strong>'+students.reduce((a,s)=>a+s.sessions.length,0)+'</strong><span>课堂记录</span></div>';
        renderQueue(students);
      }
      load().catch(function(){queue.innerHTML='<div class="error-state"><div class="error-icon">⚠️</div><h3>加载失败</h3><p>可能是网络问题或服务暂不可用</p><button class="btn ghost small" onclick="location.reload()">重新加载</button></div>';});
    }
  </script>
</body>
</html>
